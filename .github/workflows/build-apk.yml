          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/ModelDownloader.kt <<'EOF'
          package com.jarvis.v4.ai

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL

          data class DownloadProgress(
              val downloaded: Long,
              val total: Long,
              val speedBytesPerSecond: Long
          ) {
              val percent: Int
                  get() {
                      if (total <= 0L) return 0
                      return ((downloaded * 100L) / total)
                          .coerceIn(0L, 100L)
                          .toInt()
                  }
          }

          class ModelDownloader(
              private val context: Context
          ) {

              companion object {
                  const val MODEL_NAME =
                      "gemma-4-E2B-it.litertlm"

                  private const val TEMP_NAME =
                      "gemma-4-E2B-it.litertlm.part"

                  private const val MODEL_DIRECTORY =
                      "litert_models"

                  private const val MODEL_URL =
                      "https://huggingface.co/litert-community/" +
                          "gemma-4-E2B-it-litert-lm/resolve/main/" +
                          "gemma-4-E2B-it.litertlm"
              }

              private val directory: File
                  get() = File(
                      context.filesDir,
                      MODEL_DIRECTORY
                  )

              val modelFile: File
                  get() = File(
                      directory,
                      MODEL_NAME
                  )

              private val tempFile: File
                  get() = File(
                      directory,
                      TEMP_NAME
                  )

              fun isInstalled(): Boolean {
                  return modelFile.exists() &&
                      modelFile.length() > 0L
              }

              fun installedSize(): Long {
                  return if (modelFile.exists()) {
                      modelFile.length()
                  } else {
                      0L
                  }
              }

              suspend fun download(
                  onProgress: suspend (DownloadProgress) -> Unit
              ): Result<Unit> =
                  withContext(Dispatchers.IO) {

                      try {
                          directory.mkdirs()

                          if (isInstalled()) {
                              return@withContext Result.success(Unit)
                          }

                          var existingBytes =
                              if (tempFile.exists()) {
                                  tempFile.length()
                              } else {
                                  0L
                              }

                          var connection =
                              openConnection(existingBytes)

                          var responseCode =
                              connection.responseCode

                          if (
                              existingBytes > 0L &&
                              responseCode == HttpURLConnection.HTTP_OK
                          ) {
                              connection.disconnect()
                              tempFile.delete()
                              existingBytes = 0L
                              connection = openConnection(0L)
                              responseCode = connection.responseCode
                          }

                          if (
                              responseCode !=
                              HttpURLConnection.HTTP_OK &&
                              responseCode !=
                              HttpURLConnection.HTTP_PARTIAL
                          ) {
                              connection.disconnect()

                              return@withContext Result.failure(
                                  Exception(
                                      "Download server returned HTTP " +
                                          responseCode
                                  )
                              )
                          }

                          val contentLength =
                              connection.getHeaderFieldLong(
                                  "Content-Length",
                                  -1L
                              )

                          val totalBytes =
                              if (
                                  responseCode ==
                                      HttpURLConnection.HTTP_PARTIAL
                              ) {
                                  existingBytes + contentLength
                              } else {
                                  contentLength
                              }

                          val input =
                              connection.inputStream

                          val output =
                              RandomAccessFile(
                                  tempFile,
                                  "rw"
                              )

                          if (existingBytes > 0L) {
                              output.seek(existingBytes)
                          } else {
                              output.setLength(0L)
                          }

                          val buffer = ByteArray(1024 * 1024)

                          var downloaded = existingBytes
                          var lastTime = System.currentTimeMillis()
                          var lastBytes = downloaded

                          while (true) {

                              val count =
                                  input.read(buffer)

                              if (count == -1) {
                                  break
                              }

                              output.write(
                                  buffer,
                                  0,
                                  count
                              )

                              downloaded += count

                              val now =
                                  System.currentTimeMillis()

                              if (
                                  now - lastTime >= 500L
                              ) {
                                  val elapsed =
                                      now - lastTime

                                  val speed =
                                      if (elapsed > 0L) {
                                          (
                                              (downloaded -
                                                  lastBytes) *
                                                  1000L
                                          ) / elapsed
                                      } else {
                                          0L
                                      }

                                  onProgress(
                                      DownloadProgress(
                                          downloaded = downloaded,
                                          total = totalBytes,
                                          speedBytesPerSecond = speed
                                      )
                                  )

                                  lastTime = now
                                  lastBytes = downloaded
                              }
                          }

                          output.close()
                          input.close()
                          connection.disconnect()

                          if (
                              totalBytes > 0L &&
                              downloaded < totalBytes
                          ) {
                              return@withContext Result.failure(
                                  Exception(
                                      "Download ended before completion."
                                  )
                              )
                          }

                          if (downloaded <= 0L) {
                              return@withContext Result.failure(
                                  Exception(
                                      "Downloaded model is empty."
                                  )
                              )
                          }

                          if (modelFile.exists()) {
                              modelFile.delete()
                          }

                          if (!tempFile.renameTo(modelFile)) {
                              return@withContext Result.failure(
                                  Exception(
                                      "Could not install downloaded model."
                                  )
                              )
                          }

                          onProgress(
                              DownloadProgress(
                                  downloaded = downloaded,
                                  total = downloaded,
                                  speedBytesPerSecond = 0L
                              )
                          )

                          Result.success(Unit)

                      } catch (e: Exception) {

                          Result.failure(
                              Exception(
                                  e.message
                                      ?: "Model download failed."
                              )
                          )
                      }
                  }

              private fun openConnection(
                  startByte: Long
              ): HttpURLConnection {

                  val connection =
                      URL(MODEL_URL)
                          .openConnection()
                          as HttpURLConnection

                  connection.connectTimeout = 30000
                  connection.readTimeout = 30000
                  connection.instanceFollowRedirects = true

                  if (startByte > 0L) {
                      connection.setRequestProperty(
                          "Range",
                          "bytes=$startByte-"
                      )
                  }

                  connection.connect()

                  return connection
              }

              fun deletePartialDownload() {
                  if (tempFile.exists()) {
                      tempFile.delete()
                  }
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/LocalAI.kt <<'EOF'
          package com.jarvis.v4.ai

          import android.content.Context
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Conversation
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.collect
          import kotlinx.coroutines.withContext
          import java.io.File

          class LocalAI(
              private val context: Context
          ) {

              companion object {
                  private const val MODEL_NAME =
                      "gemma-4-E2B-it.litertlm"

                  private const val MODEL_DIRECTORY =
                      "litert_models"
              }

              private var engine: Engine? = null
              private var conversation: Conversation? = null
              private var initialized = false

              private val modelFile: File
                  get() = File(
                      File(
                          context.filesDir,
                          MODEL_DIRECTORY
                      ),
                      MODEL_NAME
                  )

              suspend fun initialize(): Result<String> =
                  withContext(Dispatchers.IO) {

                      if (initialized) {
                          return@withContext Result.success(
                              "Local Gemma is already ready."
                          )
                      }

                      if (!modelFile.exists()) {
                          return@withContext Result.failure(
                              Exception(
                                  "Gemma model is not installed."
                              )
                          )
                      }

                      try {

                          val config = EngineConfig(
                              modelPath =
                                  modelFile.absolutePath,
                              backend = Backend.CPU()
                          )

                          val newEngine =
                              Engine(config)

                          newEngine.initialize()

                          engine = newEngine

                          conversation =
                              newEngine.createConversation()

                          initialized = true

                          Result.success(
                              "Local Gemma is ready."
                          )

                      } catch (e: Exception) {

                          try {
                              engine?.close()
                          } catch (_: Exception) {
                          }

                          engine = null
                          conversation = null
                          initialized = false

                          Result.failure(
                              Exception(
                                  "Local AI initialization failed: " +
                                      (
                                          e.message
                                              ?: "Unknown error"
                                      )
                              )
                          )
                      }
                  }

              suspend fun ask(
                  prompt: String
              ): Result<String> =
                  withContext(Dispatchers.IO) {

                      if (prompt.isBlank()) {
                          return@withContext Result.failure(
                              Exception("Prompt is empty.")
                          )
                      }

                      if (!initialized) {
                          val result = initialize()

                          if (result.isFailure) {
                              return@withContext Result.failure(
                                  result.exceptionOrNull()
                                      ?: Exception(
                                          "Local AI initialization failed."
                                      )
                              )
                          }
                      }

                      try {

                          val currentConversation =
                              conversation
                                  ?: return@withContext Result.failure(
                                      Exception(
                                          "Conversation is unavailable."
                                      )
                                  )

                          val fullPrompt = """
                              You are JARVIS, a personal AI assistant.

                              Answer naturally and concisely.

                              The user may speak English,
                              Hindi, or Hinglish.

                              Keep answers suitable
                              for a voice assistant.

                              User:
                              $prompt
                          """.trimIndent()

                          val response =
                              StringBuilder()

                          currentConversation
                              .sendMessageAsync(fullPrompt)
                              .collect { message ->
                                  response.append(
                                      message.toString()
                                  )
                              }

                          val answer =
                              response.toString().trim()

                          if (answer.isBlank()) {
                              return@withContext Result.failure(
                                  Exception(
                                      "Local Gemma returned an empty response."
                                  )
                              )
                          }

                          Result.success(answer)

                      } catch (e: Exception) {

                          Result.failure(
                              Exception(
                                  "Local AI error: " +
                                      (
                                          e.message
                                              ?: "Unknown error"
                                      )
                            )
                          )
                      }
                  }

              fun isModelInstalled(): Boolean {
                  return modelFile.exists()
              }

              fun close() {

                  try {
                      conversation?.close()
                  } catch (_: Exception) {
                  }

                  try {
                      engine?.close()
                  } catch (_: Exception) {
                  }

                  conversation = null
                  engine = null
                  initialized = false
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/MainActivity.kt <<'EOF'
          package com.jarvis.v4

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import com.jarvis.v4.ai.ModelDownloader
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var downloader: ModelDownloader

              private lateinit var title: TextView
              private lateinit var subtitle: TextView
              private lateinit var status: TextView
              private lateinit var progress: ProgressBar
              private lateinit var details: TextView
              private lateinit var button: Button

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  downloader =
                      ModelDownloader(this)

                  createScreen()

                  if (downloader.isInstalled()) {
                      showInstalled()
                  } else {
                      showDownloadReady()
                  }
              }

              private fun createScreen() {

                  val root =
                      LinearLayout(this)

                  root.orientation =
                      LinearLayout.VERTICAL

                  root.gravity =
                      Gravity.CENTER_HORIZONTAL

                  root.setPadding(
                      40,
                      80,
                      40,
                      40
                  )

                  root.setBackgroundColor(
                      Color.rgb(5, 8, 12)
                  )

                  title =
                      TextView(this)

                  title.text =
                      "JARVIS V4"

                  title.textSize =
                      34f

                  title.setTextColor(
                      Color.WHITE
                  )

                  title.gravity =
                      Gravity.CENTER

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  )

                  subtitle =
                      TextView(this)

                  subtitle.text =
                      "LOCAL AI SETUP"

                  subtitle.textSize =
                      18f

                  subtitle.setTextColor(
                      Color.rgb(0, 210, 255)
                  )

                  subtitle.gravity =
                      Gravity.CENTER

                  val subtitleParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  subtitleParams.topMargin =
                      25

                  root.addView(
                      subtitle,
                      subtitleParams
                  )

                  status =
                      TextView(this)

                  status.textSize =
                      22f

                  status.setTextColor(
                      Color.WHITE
                  )

                  status.gravity =
                      Gravity.CENTER

                  val statusParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  statusParams.topMargin =
                      35

                  root.addView(
                      status,
                      statusParams
                  )

                  progress =
                      ProgressBar(
                          this,
                          null,
                          android.R.attr.progressBarStyleHorizontal
                      )

                  progress.max = 100

                  progress.progress = 0

                  val progressParams =
                      LinearLayout.LayoutParams(
                          -1,
                          30
                      )

                  progressParams.topMargin =
                      30

                  root.addView(
                      progress,
                      progressParams
                  )

                  details =
                      TextView(this)

                  details.textSize =
                      15f

                  details.setTextColor(
                      Color.LTGRAY
                  )

                  details.gravity =
                      Gravity.CENTER

                  val detailsParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  detailsParams.topMargin =
                      15

                  root.addView(
                      details,
                      detailsParams
                  )

                  button =
                      Button(this)

                  button.text =
                      "DOWNLOAD & INSTALL"

                  val buttonParams =
                      LinearLayout.LayoutParams(
                          -1,
                          60
                      )

                  buttonParams.topMargin =
                      45

                  root.addView(
                      button,
                      buttonParams
                  )

                  setContentView(root)
              }

              private fun showDownloadReady() {

                  status.text =
                      "Gemma 4 E2B"

                  details.text =
                      "2.58 GB • On-device AI\n" +
                          "Private local inference"

                  progress.visibility =
                      View.VISIBLE

                  progress.progress =
                      0

                  button.isEnabled =
                      true

                  button.text =
                      "DOWNLOAD & INSTALL"

                  button.setOnClickListener {
                      startDownload()
                  }
              }

              private fun startDownload() {

                  button.isEnabled =
                      false

                  status.text =
                      "Preparing download..."

                  details.text =
                      "Please keep JARVIS open."

                  lifecycleScope.launch {

                      val result =
                          downloader.download { data ->

                              runOnUiThread {

                                  progress.progress =
                                      data.percent

                                  status.text =
                                      "Downloading Gemma..."

                                  val downloaded =
                                      formatBytes(
                                          data.downloaded
                                      )

                                  val total =
                                      if (data.total > 0L) {
                                          formatBytes(
                                              data.total
                                          )
                                      } else {
                                          "Unknown"
                                      }

                                  val speed =
                                      formatBytes(
                                          data.speedBytesPerSecond
                                      )

                                  details.text =
                                      "${data.percent}%\n" +
                                          "$downloaded / $total\n" +
                                          "$speed/s"
                              }
                          }

                      if (result.isSuccess) {
                          showInstalled()
                      } else {
                          button.isEnabled =
                              true

                          button.text =
                              "RETRY DOWNLOAD"

                          status.text =
                              "Download failed"

                          details.text =
                              result.exceptionOrNull()
                                  ?.message
                                  ?: "Unknown error"
                      }
                  }
              }

              private fun showInstalled() {

                  status.text =
                      "✓ Gemma 4 E2B Installed"

                  status.setTextColor(
                      Color.rgb(50, 230, 120)
                  )

                  progress.progress =
                      100

                  details.text =
                      "Local AI is ready.\n" +
                          "Model stored securely on this device."

                  button.text =
                      "LOCAL AI READY"

                  button.isEnabled =
                      false
              }

              private fun formatBytes(
                  bytes: Long
              ): String {

                  if (bytes <= 0L) {
                      return "0 B"
                  }

                  val units =
                      arrayOf(
                          "B",
                          "KB",
                          "MB",
                          "GB"
                      )

                  var value =
                      bytes.toDouble()

                  var index =
                      0

                  while (
                      value >= 1024 &&
                      index < units.size - 1
                  ) {
                      value /= 1024.0
                      index++
                  }

                  return String.format(
                      Locale.US,
                      "%.2f %s",
                      value,
                      units[index]
                  )
              }
          }
          EOF

