name: JARVIS V4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Create JARVIS V4 project
        shell: bash
        run: |
          set -e

          rm -rf JARVIS_V4

          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/ai
          mkdir -p JARVIS_V4/app/src/main/res/values

          cat > JARVIS_V4/settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS_V4"

          include(":app")
          EOF

          cat > JARVIS_V4/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
          }
          EOF

          cat > JARVIS_V4/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > JARVIS_V4/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.v4"

              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jarvis.v4"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "4.0"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig = true
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          dependencies {
              implementation(
                  "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
              )

              implementation(
                  "com.google.ai.edge.litertlm:litertlm-android:0.16.1"
              )
          }
          EOF

          cat > JARVIS_V4/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="Theme.JarvisV4"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#050505</item>
                  <item name="android:navigationBarColor">#050505</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > JARVIS_V4/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="JARVIS V4"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.JarvisV4">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/ModelDownloader.kt <<'EOF'
          package com.jarvis.v4.ai

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL

          data class DownloadProgress(
              val downloaded: Long,
              val total: Long,
              val speed: Long
          ) {
              val percent: Int
                  get() {
                      if (total <= 0L) {
                          return 0
                      }

                      return (
                          (downloaded * 100L) / total
                      )
                          .coerceIn(0L, 100L)
                          .toInt()
                  }
          }

          class ModelDownloader(
              private val context: Context
          ) {

              companion object {

                  const val MODEL_NAME =
                      "gemma-4-E2B-it.litertlm"

                  private const val TEMP_NAME =
                      "gemma-4-E2B-it.litertlm.part"

                  private const val DIRECTORY =
                      "litert_models"

                  private const val MODEL_URL =
                      "https://huggingface.co/" +
                      "litert-community/" +
                      "gemma-4-E2B-it-litert-lm/" +
                      "resolve/main/" +
                      "gemma-4-E2B-it.litertlm"
              }

              private val directory: File
                  get() = File(
                      context.filesDir,
                      DIRECTORY
                  )

              val modelFile: File
                  get() = File(
                      directory,
                      MODEL_NAME
                  )

              private val tempFile: File
                  get() = File(
                      directory,
                      TEMP_NAME
                  )

              fun isInstalled(): Boolean {
                  return modelFile.exists() &&
                      modelFile.length() > 0L
              }

              suspend fun download(
                  onProgress:
                      suspend (DownloadProgress) -> Unit
              ): Result<Unit> =
                  withContext(Dispatchers.IO) {

                      try {

                          directory.mkdirs()

                          if (isInstalled()) {
                              return@withContext Result.success(
                                  Unit
                              )
                          }

                          var startByte =
                              if (tempFile.exists()) {
                                  tempFile.length()
                              } else {
                                  0L
                              }

                          var connection =
                              openConnection(startByte)

                          var responseCode =
                              connection.responseCode

                          if (
                              startByte > 0L &&
                              responseCode ==
                                  HttpURLConnection.HTTP_OK
                          ) {

                              connection.disconnect()

                              tempFile.delete()

                              startByte = 0L

                              connection =
                                  openConnection(0L)

                              responseCode =
                                  connection.responseCode
                          }

                          if (
                              responseCode !=
                                  HttpURLConnection.HTTP_OK &&
                              responseCode !=
                                  HttpURLConnection.HTTP_PARTIAL
                          ) {

                              connection.disconnect()

                              return@withContext Result.failure(
                                  Exception(
                                      "HTTP error: $responseCode"
                                  )
                              )
                          }

                          val contentLength =
                              connection.getHeaderFieldLong(
                                  "Content-Length",
                                  -1L
                              )

                          val totalBytes =
                              if (
                                  responseCode ==
                                      HttpURLConnection.HTTP_PARTIAL
                              ) {
                                  if (contentLength > 0L) {
                                      startByte + contentLength
                                  } else {
                                      -1L
                                  }
                              } else {
                                  contentLength
                              }

                          val input =
                              connection.inputStream

                          val output =
                              RandomAccessFile(
                                  tempFile,
                                  "rw"
                              )

                          if (startByte > 0L) {
                              output.seek(startByte)
                          } else {
                              output.setLength(0L)
                          }

                          val buffer =
                              ByteArray(1024 * 1024)

                          var downloaded =
                              startByte

                          var lastBytes =
                              downloaded

                          var lastTime =
                              System.currentTimeMillis()

                          while (true) {

                              val count =
                                  input.read(buffer)

                              if (count < 0) {
                                  break
                              }

                              output.write(
                                  buffer,
                                  0,
                                  count
                              )

                              downloaded += count

                              val now =
                                  System.currentTimeMillis()

                              if (
                                  now - lastTime >= 500L
                              ) {

                                  val elapsed =
                                      now - lastTime

                                  val speed =
                                      if (elapsed > 0L) {
                                          (
                                              (
                                                  downloaded -
                                                      lastBytes
                                              ) * 1000L
                                          ) / elapsed
                                      } else {
                                          0L
                                      }

                                  onProgress(
                                      DownloadProgress(
                                          downloaded,
                                          totalBytes,
                                          speed
                                      )
                                  )

                                  lastBytes =
                                      downloaded

                                  lastTime =
                                      now
                              }
                          }

                          output.close()

                          input.close()

                          connection.disconnect()

                          if (
                              totalBytes > 0L &&
                              downloaded < totalBytes
                          ) {

                              return@withContext Result.failure(
                                  Exception(
                                      "Download incomplete."
                                  )
                              )
                          }

                          if (downloaded <= 0L) {

                              return@withContext Result.failure(
                                  Exception(
                                      "Downloaded file is empty."
                                  )
                              )
                          }

                          if (modelFile.exists()) {
                              modelFile.delete()
                          }

                          if (
                              !tempFile.renameTo(
                                  modelFile
                              )
                          ) {

                              return@withContext Result.failure(
                                  Exception(
                                      "Model installation failed."
                                  )
                              )
                          }

                          onProgress(
                              DownloadProgress(
                                  downloaded,
                                  downloaded,
                                  0L
                              )
                          )

                          Result.success(Unit)

                      } catch (e: Exception) {

                          Result.failure(
                              Exception(
                                  e.message
                                      ?: "Model download failed."
                              )
                          )
                      }
                  }

              private fun openConnection(
                  startByte: Long
              ): HttpURLConnection {

                  val connection =
                      URL(MODEL_URL)
                          .openConnection()
                          as HttpURLConnection

                  connection.connectTimeout =
                      30000

                  connection.readTimeout =
                      30000

                  connection.instanceFollowRedirects =
                      true

                  if (startByte > 0L) {

                      connection.setRequestProperty(
                          "Range",
                          "bytes=$startByte-"
                      )
                  }

                  connection.connect()

                  return connection
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/LocalAI.kt <<'EOF'
          package com.jarvis.v4.ai

          import android.content.Context
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Conversation
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.collect
          import kotlinx.coroutines.withContext
          import java.io.File

          class LocalAI(
              private val context: Context
          ) {

              private var engine: Engine? =
                  null

              private var conversation:
                  Conversation? = null

              private val modelFile: File
                  get() = File(
                      File(
                          context.filesDir,
                          "litert_models"
                      ),
                      ModelDownloader.MODEL_NAME
                  )

              suspend fun initialize():
                  Result<String> =
                  withContext(Dispatchers.IO) {

                      if (!modelFile.exists()) {

                          return@withContext Result.failure(
                              Exception(
                                  "Gemma model is not installed."
                              )
                          )
                      }

                      try {

                          val newEngine =
                              Engine(
                                  EngineConfig(
                                      modelPath =
                                          modelFile.absolutePath,
                                      backend =
                                          Backend.CPU()
                                  )
                              )

                          newEngine.initialize()

                          engine =
                              newEngine

                          conversation =
                              newEngine
                                  .createConversation()

                          Result.success(
                              "Local Gemma is ready."
                          )

                      } catch (e: Exception) {

                          close()

                          Result.failure(
                              Exception(
                                  e.message
                                      ?: "Local AI failed."
                              )
                          )
                      }
                  }

              suspend fun ask(
                  prompt: String
              ): Result<String> =
                  withContext(Dispatchers.IO) {

                      if (conversation == null) {

                          val init =
                              initialize()

                          if (init.isFailure) {

                              return@withContext Result.failure(
                                  init.exceptionOrNull()
                                      ?: Exception(
                                          "Local AI failed."
                                      )
                              )
                          }
                      }

                      try {

                          val output =
                              StringBuilder()

                          conversation!!
                              .sendMessageAsync(prompt)
                              .collect { message ->

                                  output.append(
                                      message.toString()
                                  )
                              }

                          Result.success(
                              output.toString().trim()
                          )

                      } catch (e: Exception) {

                          Result.failure(
                              Exception(
                                  e.message
                                      ?: "Local AI error."
                              )
                          )
                      }
                  }

              fun close() {

                  try {
                      conversation?.close()
                  } catch (_: Exception) {
                  }

                  try {
                      engine?.close()
                  } catch (_: Exception) {
                  }

                  conversation =
                      null

                  engine =
                      null
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/MainActivity.kt <<'EOF'
          package com.jarvis.v4

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import com.jarvis.v4.ai.ModelDownloader
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var downloader:
                  ModelDownloader

              private lateinit var status:
                  TextView

              private lateinit var details:
                  TextView

              private lateinit var progress:
                  ProgressBar

              private lateinit var button:
                  Button

              private var downloadJob:
                  Job? = null

              private val mainScope =
                  CoroutineScope(
                      Dispatchers.Main +
                          SupervisorJob()
                  )

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(
                      savedInstanceState
                  )

                  downloader =
                      ModelDownloader(this)

                  createScreen()

                  if (
                      downloader.isInstalled()
                  ) {
                      showInstalled()
                  } else {
                      showReady()
                  }
              }

              private fun createScreen() {

                  val root =
                      LinearLayout(this)

                  root.orientation =
                      LinearLayout.VERTICAL

                  root.gravity =
                      Gravity.CENTER_HORIZONTAL

                  root.setPadding(
                      40,
                      70,
                      40,
                      40
                  )

                  root.setBackgroundColor(
                      Color.rgb(5, 8, 12)
                  )

                  val title =
                      TextView(this)

                  title.text =
                      "JARVIS V4"

                  title.textSize =
                      34f

                  title.gravity =
                      Gravity.CENTER

                  title.setTextColor(
                      Color.WHITE
                  )

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  )

                  val subtitle =
                      TextView(this)

                  subtitle.text =
                      "LOCAL AI SETUP"

                  subtitle.textSize =
                      18f

                  subtitle.gravity =
                      Gravity.CENTER

                  subtitle.setTextColor(
                      Color.rgb(
                          0,
                          210,
                          255
                      )
                  )

                  val subtitleParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  subtitleParams.topMargin =
                      25

                  root.addView(
                      subtitle,
                      subtitleParams
                  )

                  status =
                      TextView(this)

                  status.textSize =
                      22f

                  status.gravity =
                      Gravity.CENTER

                  status.setTextColor(
                      Color.WHITE
                  )

                  val statusParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  statusParams.topMargin =
                      35

                  root.addView(
                      status,
                      statusParams
                  )

                  progress =
                      ProgressBar(
                          this,
                          null,
                          android.R.attr
                              .progressBarStyleHorizontal
                      )

                  progress.max =
                      100

                  progress.progress =
                      0

                  val progressParams =
                      LinearLayout.LayoutParams(
                          -1,
                          30
                      )

                  progressParams.topMargin =
                      30

                  root.addView(
                      progress,
                      progressParams
                  )

                  details =
                      TextView(this)

                  details.textSize =
                      15f

                  details.gravity =
                      Gravity.CENTER

                  details.setTextColor(
                      Color.LTGRAY
                  )

                  val detailsParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  detailsParams.topMargin =
                      15

                  root.addView(
                      details,
                      detailsParams
                  )

                  button =
                      Button(this)

                  val buttonParams =
                      LinearLayout.LayoutParams(
                          -1,
                          60
                      )

                  buttonParams.topMargin =
                      45

                  root.addView(
                      button,
                      buttonParams
                  )

                  setContentView(root)
              }

              private fun showReady() {

                  status.text =
                      "Gemma 4 E2B"

                  details.text =
                      "2.58 GB • On-device AI\n" +
                      "Private local inference"

                  progress.visibility =
                      View.VISIBLE

                  progress.progress =
                      0

                  button.isEnabled =
                      true

                  button.text =
                      "DOWNLOAD & INSTALL"

                  button.setOnClickListener {
                      startDownload()
                  }
              }

              private fun startDownload() {

                  button.isEnabled =
                      false

                  status.text =
                      "Preparing download..."

                  details.text =
                      "Please keep JARVIS open."

                  downloadJob =
                      mainScope.launch {

                          val result =
                              downloader.download {

                                  data ->

                                  runOnUiThread {

                                      progress.progress =
                                          data.percent

                                      status.text =
                                          "Downloading Gemma..."

                                      details.text =
                                          data.percent
                                              .toString() +
                                          "%\n" +
                                          format(
                                              data.downloaded
                                          ) +
                                          " / " +
                                          format(
                                              data.total
                                          ) +
                                          "\n" +
                                          format(
                                              data.speed
                                          ) +
                                          "/s"
                                  }
                              }

                          if (
                              result.isSuccess
                          ) {
                              showInstalled()
                          } else {

                              button.isEnabled =
                                  true

                              button.text =
                                  "RETRY DOWNLOAD"

                              status.text =
                                  "Download failed"

                              details.text =
                                  result
                                      .exceptionOrNull()
                                      ?.message
                                      ?: "Unknown error"
                          }
                      }
              }

              private fun showInstalled() {

                  status.text =
                      "✓ Gemma 4 E2B Installed"

                  status.setTextColor(
                      Color.rgb(
                          50,
                          230,
                          120
                      )
                  )

                  progress.progress =
                      100

                  details.text =
                      "Local AI is ready.\n" +
                      "Model installed on device."

                  button.text =
                      "LOCAL AI READY"

                  button.isEnabled =
                      false
              }

              private fun format(
                  bytes: Long
              ): String {

                  if (bytes <= 0L) {
                      return "0 B"
                  }

                  val units =
                      arrayOf(
                          "B",
                          "KB",
                          "MB",
                          "GB"
                      )

                  var value =
                      bytes.toDouble()

                  var index =
                      0

                  while (
                      value >= 1024.0 &&
                      index <
                          units.size - 1
                  ) {

                      value /= 1024.0

                      index++
                  }

                  return String.format(
                      Locale.US,
                      "%.2f %s",
                      value,
                      units[index]
                  )
              }

              override fun onDestroy() {

                  downloadJob?.cancel()

                  mainScope.cancel()

                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        working-directory: JARVIS_V4
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleDebug --stacktrace

      - name: Commit generated project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JARVIS_V4

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix JARVIS V4 startup"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V4-APK
          path: JARVIS_V4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
