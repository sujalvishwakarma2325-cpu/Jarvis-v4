name: JARVIS V4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Create JARVIS V4 project
        shell: bash
        run: |
          set -e

          rm -rf JARVIS_V4

          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/ai
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/voice
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/core
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/actions
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/memory
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/phone
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/calls
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/notifications
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/camera
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/scheduler
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/background
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/developer
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/modes
          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/ui
          mkdir -p JARVIS_V4/app/src/main/res/values

          cat > JARVIS_V4/settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS_V4"
          include(":app")
          EOF

          cat > JARVIS_V4/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
          }
          EOF

          cat > JARVIS_V4/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > JARVIS_V4/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.v4"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jarvis.v4"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "4.0"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig = true
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.1")

              implementation(
                  "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
              )

              implementation(
                  "com.google.ai.edge.litertlm:litertlm-android:0.16.1"
