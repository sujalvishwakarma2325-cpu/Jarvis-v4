          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ui/JarvisOrbView.kt <<'EOF'
          package com.jarvis.v4.ui
          class JarvisOrbView
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ui/JarvisTheme.kt <<'EOF'
          package com.jarvis.v4.ui
          class JarvisTheme
          EOF

      - name: Verify generated files
        run: |
          echo "===== JARVIS V4 FILES ====="
          find JARVIS_V4 -type f | sort
          echo "==========================="

      - name: Build APK
        working-directory: JARVIS_V4
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleDebug --stacktrace

      - name: Commit generated project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JARVIS_V4

          if git diff --cached --quiet; then
            echo "No JARVIS V4 changes to commit."
          else
            git commit -m "Generate JARVIS V4 project"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V4-APK
          path: JARVIS_V4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
