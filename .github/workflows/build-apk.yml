name: JARVIS V4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          mkdir -p "$RUNNER_TEMP/jarvis-signing"

          echo "$KEYSTORE_B64" |
            base64 --decode >
            "$RUNNER_TEMP/jarvis-signing/jarvis-v4-release.jks"

          test -s \
            "$RUNNER_TEMP/jarvis-signing/jarvis-v4-release.jks"

      - name: Create JARVIS V4 project
        shell: bash
        run: |
          set -e

          rm -rf JARVIS_V4

          mkdir -p \
            JARVIS_V4/app/src/main/java/com/jarvis/v4/ai

          mkdir -p \
            JARVIS_V4/app/src/main/java/com/jarvis/v4

          mkdir -p \
            JARVIS_V4/app/src/main/res/values

          cat > JARVIS_V4/settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS_V4"

          include(":app")
          EOF

          cat > JARVIS_V4/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
          }
          EOF

          cat > JARVIS_V4/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > JARVIS_V4/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.v4"

              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jarvis.v4"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "4.2"
              }

              signingConfigs {
                  create("release") {
                      val keystorePath =
                          System.getenv("JARVIS_KEYSTORE_PATH")
                              ?: error(
                                  "JARVIS_KEYSTORE_PATH is missing"
                              )

                      storeFile = file(keystorePath)

                      storePassword =
                          System.getenv(
                              "JARVIS_KEYSTORE_PASSWORD"
                          ) ?: error(
                              "JARVIS_KEYSTORE_PASSWORD is missing"
                          )

                      keyAlias = "jarvis"

                      keyPassword =
                          System.getenv(
                              "JARVIS_KEY_PASSWORD"
                          ) ?: error(
                              "JARVIS_KEY_PASSWORD is missing"
                          )
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                      signingConfig =
                          signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility =
                      JavaVersion.VERSION_17

                  targetCompatibility =
                      JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig = true
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          dependencies {
              implementation(
                  "org.jetbrains.kotlinx:" +
                      "kotlinx-coroutines-android:1.10.2"
              )

              implementation(
                  "com.google.ai.edge.litertlm:" +
                      "litertlm-android:0.16.1"
              )
          }
          EOF

          cat > JARVIS_V4/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="Theme.JarvisV4"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:statusBarColor">
                      #050505
                  </item>

                  <item name="android:navigationBarColor">
                      #050505
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

          cat > JARVIS_V4/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="JARVIS V4"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.JarvisV4">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/ModelDownloader.kt <<'EOF'
          package com.jarvis.v4.ai

          import android.content.ContentValues
          import android.content.Context
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          class ModelDownloader(
              private val context: Context
          ) {

              companion object {

                  private const val MODEL_NAME =
                      "gemma-4-E2B-it.litertlm"

                  private const val DOWNLOAD_PATH =
                      "Download/JARVIS_V4"

                  private const val MODEL_URL =
                      "https://huggingface.co/" +
                      "litert-community/" +
                      "gemma-4-E2B-it-litert-lm/" +
                      "resolve/main/" +
                      "gemma-4-E2B-it.litertlm"

                  private const val MODEL_DIRECTORY =
                      "litert_models"
              }

              private val internalModel: File
                  get() = File(
                      File(
                          context.filesDir,
                          MODEL_DIRECTORY
                      ),
                      MODEL_NAME
                  )

              suspend fun ensureModel():
                  Result<String> =
                  withContext(Dispatchers.IO) {

                      try {

                          if (internalModel.exists() &&
                              internalModel.length() > 0L
                          ) {
                              return@withContext Result.success(
                                  "Gemma model is ready."
                              )
                          }

                          internalModel.parentFile?.mkdirs()

                          val savedUri =
                              findSavedModel()

                          if (savedUri != null) {

                              copyFromDownloads(
                                  savedUri
                              )

                              return@withContext Result.success(
                                  "Gemma model restored."
                              )
                          }

                          downloadModel()

                          val downloadedUri =
                              findSavedModel()

                          if (downloadedUri == null) {
                              return@withContext Result.failure(
                                  Exception(
                                      "Gemma download completed " +
                                      "but model was not found."
                                  )
                              )
                          }

                          copyFromDownloads(
                              downloadedUri
                          )

                          Result.success(
                              "Gemma model downloaded."
                          )

                      } catch (e: Exception) {

                          Result.failure(
                              Exception(
                                  "Gemma model error: " +
                                  (
                                      e.message
                                          ?: "Unknown error"
                                  )
                              )
                          )
                      }
                  }

              private fun findSavedModel():
                  android.net.Uri? {

                  val collection =
                      MediaStore.Downloads.EXTERNAL_CONTENT_URI

                  val projection =
                      arrayOf(
                          MediaStore.Downloads._ID,
                          MediaStore.Downloads.DISPLAY_NAME,
                          MediaStore.Downloads.RELATIVE_PATH
                      )

                  val selection =
                      MediaStore.Downloads.DISPLAY_NAME +
                          " = ? AND " +
                          MediaStore.Downloads.RELATIVE_PATH +
                          " = ?"

                  val selectionArgs =
                      arrayOf(
                          MODEL_NAME,
                          "$DOWNLOAD_PATH/"
                      )

                  context.contentResolver.query(
                      collection,
                      projection,
                      selection,
                      selectionArgs,
                      null
                  )?.use { cursor ->

                      if (cursor.moveToFirst()) {

                          val id =
                              cursor.getLong(
                                  cursor.getColumnIndexOrThrow(
                                      MediaStore.Downloads._ID
                                  )
                              )

                          return android.content.ContentUris
                              .withAppendedId(
                                  collection,
                                  id
                              )
                      }
                  }

                  return null
              }

              private fun removeOldPendingModel() {

                  val collection =
                      MediaStore.Downloads.EXTERNAL_CONTENT_URI

                  val selection =
                      MediaStore.Downloads.DISPLAY_NAME +
                          " = ? AND " +
                          MediaStore.Downloads.RELATIVE_PATH +
                          " = ?"

                  val args =
                      arrayOf(
                          MODEL_NAME,
                          "$DOWNLOAD_PATH/"
                      )

                  context.contentResolver.delete(
                      collection,
                      selection,
                      args
                  )
              }

              private fun downloadModel() {

                  removeOldPendingModel()

                  val values =
                      ContentValues().apply {

                          put(
                              MediaStore.Downloads.DISPLAY_NAME,
                              MODEL_NAME
                          )

                          put(
                              MediaStore.Downloads.MIME_TYPE,
                              "application/octet-stream"
                          )

                          put(
                              MediaStore.Downloads.RELATIVE_PATH,
                              "$DOWNLOAD_PATH/"
                          )

                          put(
                              MediaStore.Downloads.IS_PENDING,
                              1
                          )
                      }

                  val collection =
                      MediaStore.Downloads.EXTERNAL_CONTENT_URI

                  val uri =
                      context.contentResolver.insert(
                          collection,
                          values
                      ) ?: throw Exception(
                          "Could not create Downloads file."
                      )

                  var completed = false

                  try {

                      val connection =
                          URL(MODEL_URL)
                              .openConnection()
                              as HttpURLConnection

                      connection.connectTimeout =
                          30000

                      connection.readTimeout =
                          60000

                      connection.requestMethod =
                          "GET"

                      connection.connect()

                      val response =
                          connection.responseCode

                      if (response !in 200..299) {
                          throw Exception(
                              "Download HTTP error: $response"
                          )
                      }

                      val input =
                          connection.inputStream

                      val output =
                          context.contentResolver
                              .openOutputStream(uri)

                      if (output == null) {
                          throw Exception(
                              "Could not open model output."
                          )
                      }

                      input.use { source ->
                          output.use { target ->

                              val buffer =
                                  ByteArray(1024 * 1024)

                              while (true) {

                                  val count =
                                      source.read(buffer)

                                  if (count == -1) {
                                      break
                                  }

                                  target.write(
                                      buffer,
                                      0,
                                      count
                                  )
                              }
                          }
                      }

                      connection.disconnect()

                      val doneValues =
                          ContentValues().apply {
                              put(
                                  MediaStore.Downloads.IS_PENDING,
                                  0
                              )
                          }

                      context.contentResolver.update(
                          uri,
                          doneValues,
                          null,
                          null
                      )

                      completed = true

                  } finally {

                      if (!completed) {
                          context.contentResolver.delete(
                              uri,
                              null,
                              null
                          )
                      }
                  }
              }

              private fun copyFromDownloads(
                  uri: android.net.Uri
              ) {

                  internalModel.parentFile?.mkdirs()

                  val tempFile =
                      File(
                          internalModel.parentFile,
                          "$MODEL_NAME.part"
                      )

                  context.contentResolver
                      .openInputStream(uri)
                      ?.use { input ->

                          tempFile.outputStream()
                              .use { output ->

                              val buffer =
                                  ByteArray(1024 * 1024)

                              while (true) {

                                  val count =
                                      input.read(buffer)

                                  if (count == -1) {
                                      break
                                  }

                                  output.write(
                                      buffer,
                                      0,
                                      count
                                  )
                              }
                          }
                      }
                      ?: throw Exception(
                          "Could not read saved Gemma model."
                      )

                  if (tempFile.length() <= 0L) {
                      tempFile.delete()

                      throw Exception(
                          "Saved Gemma model is empty."
                      )
                  }

                  if (internalModel.exists()) {
                      internalModel.delete()
                  }

                  if (!tempFile.renameTo(internalModel)) {
                      tempFile.copyTo(
                          internalModel,
                          overwrite = true
                      )

                      tempFile.delete()
                  }
              }

              fun isModelAvailable(): Boolean {

                  if (internalModel.exists() &&
                      internalModel.length() > 0L
                  ) {
                      return true
                  }

                  return findSavedModel() != null
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/LocalAI.kt <<'EOF'
          package com.jarvis.v4.ai

          import android.content.Context
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Conversation
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.collect
          import kotlinx.coroutines.withContext
          import java.io.File

          class LocalAI(
              private val context: Context
          ) {

              companion object {

                  private const val MODEL_NAME =
                      "gemma-4-E2B-it.litertlm"

                  private const val MODEL_DIRECTORY =
                      "litert_models"
              }

              private var engine: Engine? = null

              private var conversation:
                  Conversation? = null

              private var initialized =
                  false

              private val modelFile: File
                  get() = File(
                      File(
                          context.filesDir,
                          MODEL_DIRECTORY
                      ),
                      MODEL_NAME
                  )

              suspend fun initialize():
                  Result<String> =
                  withContext(Dispatchers.IO) {

                      if (initialized) {
                          return@withContext Result.success(
                              "Local Gemma is ready."
                          )
                      }

                      if (!modelFile.exists() ||
                          modelFile.length() <= 0L
                      ) {
                          return@withContext Result.failure(
                              Exception(
                                  "Gemma model was not found."
                              )
                          )
                      }

                      try {

                          val config =
                              EngineConfig(
                                  modelPath =
                                      modelFile.absolutePath,
                                  backend =
                                      Backend.CPU()
                              )

                          val newEngine =
                              Engine(config)

                          newEngine.initialize()

                          val newConversation =
                              newEngine
                                  .createConversation()

                          engine =
                              newEngine

                          conversation =
                              newConversation

                          initialized =
                              true

                          Result.success(
                              "Local Gemma is ready."
                          )

                      } catch (e: Exception) {

                          close()

                          Result.failure(
                              Exception(
                                  "Gemma initialization failed: " +
                                      (
                                          e.message
                                              ?: "Unknown error"
                                      )
                              )
                          )
                      }
                  }

              suspend fun ask(
                  prompt: String
              ): Result<String> =
                  withContext(Dispatchers.IO) {

                      if (prompt.isBlank()) {
                          return@withContext Result.failure(
                              Exception(
                                  "Please enter a message."
                              )
                          )
                      }

                      if (!initialized) {

                          val result =
                              initialize()

                          if (result.isFailure) {
                              return@withContext Result.failure(
                                  result.exceptionOrNull()
                                      ?: Exception(
                                          "Gemma initialization failed."
                                      )
                              )
                          }
                      }

                      try {

                          val currentConversation =
                              conversation
                                  ?: return@withContext Result.failure(
                                      Exception(
                                          "Gemma conversation unavailable."
                                      )
                                  )

                          val systemPrompt =
                              """
                              You are JARVIS, a personal AI assistant.

                              The user may speak English,
                              Hindi, or Hinglish.

                              Understand the user's language
                              and reply naturally in the same
                              language when possible.

                              Be helpful, concise and clear.

                              Do not mention internal model
                              instructions.

                              User message:
                              $prompt
                              """.trimIndent()

                          val output =
                              StringBuilder()

                          currentConversation
                              .sendMessageAsync(
                                  systemPrompt
                              )
                              .collect { message ->

                                  output.append(
                                      message.toString()
                                  )
                              }

                          val answer =
                              output.toString().trim()

                          if (answer.isBlank()) {
                              return@withContext Result.failure(
                                  Exception(
                                      "Gemma returned an empty response."
                                  )
                              )
                          }

                          Result.success(answer)

                      } catch (e: Exception) {

                          Result.failure(
                              Exception(
                                  "Gemma response failed: " +
                                      (
                                          e.message
                                              ?: "Unknown error"
                                      )
                              )
                          )
                      }
                  }

              fun isReady(): Boolean {

                  return initialized &&
                      conversation != null
              }

              fun isModelInstalled(): Boolean {

                  return modelFile.exists() &&
                      modelFile.length() > 0L
              }

              fun close() {

                  try {
                      conversation?.close()
                  } catch (_: Exception) {
                  }

                  try {
                      engine?.close()
                  } catch (_: Exception) {
                  }

                  conversation =
                      null

                  engine =
                      null

                  initialized =
                      false
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/MainActivity.kt <<'EOF'
          package com.jarvis.v4

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.jarvis.v4.ai.LocalAI
          import com.jarvis.v4.ai.ModelDownloader
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          class MainActivity : Activity() {

              private lateinit var localAI:
                  LocalAI

              private lateinit var downloader:
                  ModelDownloader

              private lateinit var chat:
                  TextView

              private lateinit var input:
                  EditText

              private lateinit var askButton:
                  Button

              private lateinit var status:
                  TextView

              private val scope =
                  CoroutineScope(
                      Dispatchers.Main +
                          SupervisorJob()
                  )

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(
                      savedInstanceState
                  )

                  localAI =
                      LocalAI(this)

                  downloader =
                      ModelDownloader(this)

                  createChatScreen()

                  prepareLocalAI()
              }

              private fun prepareLocalAI() {

                  askButton.isEnabled =
                      false

                  status.text =
                      "● CHECKING GEMMA MODEL..."

                  status.setTextColor(
                      Color.YELLOW
                  )

                  scope.launch {

                      val modelResult =
                          downloader.ensureModel()

                      if (modelResult.isFailure) {

                          appendMessage(
                              "ERROR",
                              modelResult
                                  .exceptionOrNull()
                                  ?.message
                                  ?: "Gemma model error."
                          )

                          status.text =
                              "● GEMMA MODEL ERROR"

                          status.setTextColor(
                              Color.RED
                          )

                          return@launch
                      }

                      status.text =
                          "● STARTING LOCAL GEMMA..."

                      val aiResult =
                          localAI.initialize()

                      if (aiResult.isSuccess) {

                          status.text =
                              "● LOCAL GEMMA • READY"

                          status.setTextColor(
                              Color.rgb(
                                  0,
                                  210,
                                  255
                              )

                          )

                          appendMessage(
                              "JARVIS",
                              "Local Gemma 4 E2B is ready."
                          )

                          askButton.isEnabled =
                              true

                      } else {

                          appendMessage(
                              "ERROR",
                              aiResult
                                  .exceptionOrNull()
                                  ?.message
                                  ?: "Gemma initialization failed."
                          )

                          status.text =
                              "● LOCAL AI ERROR"

                          status.setTextColor(
                              Color.RED
                          )
                      }
                  }
              }

              private fun createChatScreen() {

                  val root =
                      LinearLayout(this)

                  root.orientation =
                      LinearLayout.VERTICAL

                  root.setBackgroundColor(
                      Color.rgb(
                          5,
                          8,
                          12
                      )
                  )

                  root.setPadding(
                      25,
                      35,
                      25,
                      20
                  )

                  val header =
                      TextView(this)

                  header.text =
                      "JARVIS V4"

                  header.textSize =
                      30f

                  header.gravity =
                      Gravity.CENTER

                  header.setTextColor(
                      Color.WHITE
                  )

                  root.addView(
                      header,
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  )

                  status =
                      TextView(this)

                  status.text =
                      "● GEMMA MODEL • CHECKING"

                  status.textSize =
                      14f

                  status.gravity =
                      Gravity.CENTER

                  status.setTextColor(
                      Color.YELLOW
                  )

                  val statusParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  statusParams.topMargin =
                      10

                  root.addView(
                      status,
                      statusParams
                  )

                  val scroll =
                      ScrollView(this)

                  chat =
                      TextView(this)

                  chat.text =
                      """
                      JARVIS:
                      Hello. I am JARVIS V4.

                      Checking the local Gemma 4 E2B
                      model and starting the AI brain...
                      """.trimIndent()

                  chat.textSize =
                      17f

                  chat.setTextColor(
                      Color.WHITE
                  )

                  chat.setPadding(
                      20,
                      30,
                      20,
                      30
                  )

                  scroll.addView(
                      chat
                  )

                  val scrollParams =
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )

                  scrollParams.topMargin =
                      20

                  root.addView(
                      scroll,
                      scrollParams
                  )

                  input =
                      EditText(this)

                  input.hint =
                      "Ask JARVIS..."

                  input.textSize =
                      16f

                  input.setSingleLine(false)

                  input.setTextColor(
                      Color.WHITE
                  )

                  input.setHintTextColor(
                      Color.GRAY
                  )

                  input.setBackgroundColor(
                      Color.rgb(
                          25,
                          30,
                          36
                      )
                  )

                  input.setPadding(
                      20,
                      15,
                      20,
                      15
                  )

                  root.addView(
                      input,
                      LinearLayout.LayoutParams(
                          -1,
                          65
                      )
                  )

                  askButton =
                      Button(this)

                  askButton.text =
                      "ASK JARVIS"

                  val buttonParams =
                      LinearLayout.LayoutParams(
                          -1,
                          60
                      )

                  buttonParams.topMargin =
                      12

                  root.addView(
                      askButton,
                      buttonParams
                  )

                  askButton.setOnClickListener {
                      askJarvis()
                  }

                  setContentView(
                      root
                  )
              }

              private fun askJarvis() {

                  val prompt =
                      input.text
                          .toString()
                          .trim()

                  if (prompt.isEmpty()) {

                      input.error =
                          "Enter a message"

                      return
                  }

                  appendMessage(
                      "YOU",
                      prompt
                  )

                  input.text.clear()

                  hideKeyboard()

                  askButton.isEnabled =
                      false

                  status.text =
                      "● GEMMA IS THINKING..."

                  status.setTextColor(
                      Color.YELLOW
                  )

                  scope.launch {

                      val result =
                          localAI.ask(
                              prompt
                          )

                      if (result.isSuccess) {

                          appendMessage(
                              "JARVIS",
                              result.getOrNull()
                                  ?: ""
                          )

                          status.text =
                              "● LOCAL GEMMA • READY"

                          status.setTextColor(
                              Color.rgb(
                                  0,
                                  210,
                                  255
                              )

                          )

                      } else {

                          appendMessage(
                              "ERROR",
                              result
                                  .exceptionOrNull()
                                  ?.message
                                  ?: "Unknown error"
                          )

                          status.text =
                              "● LOCAL AI ERROR"

                          status.setTextColor(
                              Color.RED
                          )
                      }

                      askButton.isEnabled =
                          true
                  }
              }

              private fun appendMessage(
                  speaker: String,
                  message: String
              ) {

                  val current =
                      chat.text
                          .toString()

                  chat.text =
                      current +
                          "\n\n" +
                          speaker +
                          ":\n" +
                          message

                  chat.post {

                      val parent =
                          chat.parent

                      if (parent is ScrollView) {

                          parent.fullScroll(
                              View.FOCUS_DOWN
                          )
                      }
                  }
              }

              private fun hideKeyboard() {

                  val manager =
                      getSystemService(
                          Context.INPUT_METHOD_SERVICE
                      ) as InputMethodManager

                  manager.hideSoftInputFromWindow(
                      input.windowToken,
                      0
                  )
              }

              override fun onDestroy() {

                  localAI.close()

                  scope.cancel()

                  super.onDestroy()
              }
          }
          EOF

      - name: Configure signing environment
        env:
          KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          set -e

          echo \
            "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-signing/jarvis-v4-release.jks" \
            >> "$GITHUB_ENV"

          echo \
            "JARVIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" \
            >> "$GITHUB_ENV"

          echo \
            "JARVIS_KEY_PASSWORD=$KEY_PASSWORD" \
            >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: JARVIS_V4
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleRelease --stacktrace

      - name: Commit generated project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add JARVIS_V4

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit \
              -m "Add persistent signing and Gemma storage"

            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V4-APK
          path: JARVIS_V4/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
