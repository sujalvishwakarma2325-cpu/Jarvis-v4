name: JARVIS V4 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Create JARVIS V4 project
        shell: bash
        run: |
          set -e

          rm -rf JARVIS_V4

          mkdir -p JARVIS_V4/app/src/main/java/com/jarvis/v4/{ai,voice,core,actions,memory,phone,calls,notifications,camera,scheduler,background,developer,modes,ui}
          mkdir -p JARVIS_V4/app/src/main/res/values

          cat > JARVIS_V4/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS_V4"
          include(":app")
          EOF

          cat > JARVIS_V4/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
          }
          EOF

          cat > JARVIS_V4/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > JARVIS_V4/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.v4"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jarvis.v4"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "4.0"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  buildConfig = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("com.google.ai.edge.litertlm:litertlm-android:0.16.1")
          }
          EOF

          cat > JARVIS_V4/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.JarvisV4" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > JARVIS_V4/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="JARVIS V4"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.JarvisV4">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/MainActivity.kt <<'EOF'
          package com.jarvis.v4

          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val textView = TextView(this)
                  textView.text = """
                      JARVIS V4

                      System initialized.

                      Local AI:
                      Gemma 4 E2B

                      Status:
                      Ready
                  """.trimIndent()

                  textView.textSize = 20f
                  textView.setPadding(40, 80, 40, 40)
                  setContentView(textView)
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/LocalAI.kt <<'EOF'
          package com.jarvis.v4.ai

          import android.content.Context
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Conversation
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.collect
          import kotlinx.coroutines.withContext
          import java.io.File

          class LocalAI(private val context: Context) {

              companion object {
                  private const val MODEL_NAME = "gemma-4-E2B-it.litertlm"
                  private const val MODEL_DIRECTORY = "litert_models"
              }

              private var engine: Engine? = null
              private var conversation: Conversation? = null
              private var initialized = false

              private val modelFile: File
                  get() = File(
                      File(context.filesDir, MODEL_DIRECTORY),
                      MODEL_NAME
                  )

              suspend fun initialize(): Result<String> =
                  withContext(Dispatchers.IO) {
                      if (initialized) {
                          return@withContext Result.success(
                              "Local Gemma is already ready."
                          )
                      }

                      if (!modelFile.exists()) {
                          return@withContext Result.failure(
                              Exception(
                                  "Gemma model is not installed: ${modelFile.absolutePath}"
                              )
                          )
                      }

                      try {
                          val config = EngineConfig(
                              modelPath = modelFile.absolutePath,
                              backend = Backend.CPU()
                          )

                          val newEngine = Engine(config)
                          newEngine.initialize()

                          engine = newEngine
                          conversation = newEngine.createConversation()
                          initialized = true

                          Result.success("Local Gemma is ready.")
                      } catch (e: Exception) {
                          try {
                              engine?.close()
                          } catch (_: Exception) {
                          }

                          engine = null
                          conversation = null
                          initialized = false

                          Result.failure(
                              Exception(
                                  "Local AI initialization failed: ${
                                      e.message ?: "Unknown error"
                                  }"
                              )
                          )
                      }
                  }

              suspend fun ask(prompt: String): Result<String> =
                  withContext(Dispatchers.IO) {
                      if (prompt.isBlank()) {
                          return@withContext Result.failure(
                              Exception("Prompt is empty.")
                          )
                      }

                      if (!initialized) {
                          val result = initialize()
                          if (result.isFailure) {
                              return@withContext Result.failure(
                                  result.exceptionOrNull()
                                      ?: Exception("Local AI initialization failed.")
                              )
                          }
                      }

                      try {
                          val currentConversation = conversation
                              ?: return@withContext Result.failure(
                                  Exception("Conversation is unavailable.")
                              )

                          val fullPrompt = """
                              You are JARVIS, a personal AI assistant.

                              Answer naturally and concisely.
                              The user may speak English, Hindi, or Hinglish.
                              Keep answers suitable for a voice assistant.

                              User:
                              $prompt
                          """.trimIndent()

                          val response = StringBuilder()

                          currentConversation
                              .sendMessageAsync(fullPrompt)
                              .collect { message ->
                                  response.append(message.toString())
                              }

                          val answer = response.toString().trim()

                          if (answer.isBlank()) {
                              return@withContext Result.failure(
                                  Exception("Local Gemma returned an empty response.")
                              )
                          }

                          Result.success(answer)
                      } catch (e: Exception) {
                          Result.failure(
                              Exception(
                                  "Local AI error: ${
                                      e.message ?: "Unknown error"
                                  }"
                              )
                          )
                      }
                  }

              fun isModelInstalled(): Boolean = modelFile.exists()

              fun getModelPath(): String = modelFile.absolutePath

              fun getModelSizeBytes(): Long =
                  if (modelFile.exists()) modelFile.length() else 0L

              fun close() {
                  try {
                      conversation?.close()
                  } catch (_: Exception) {
                  }

                  try {
                      engine?.close()
                  } catch (_: Exception) {
                  }

                  conversation = null
                  engine = null
                  initialized = false
              }
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/AIProvider.kt <<'EOF'
          package com.jarvis.v4.ai

          interface AIProvider {
              suspend fun ask(prompt: String): Result<String>
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/AIRouter.kt <<'EOF'
          package com.jarvis.v4.ai

          class AIRouter(private val localAI: LocalAI) {
              suspend fun ask(prompt: String): Result<String> =
                  localAI.ask(prompt)
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/ClaudeAI.kt <<'EOF'
          package com.jarvis.v4.ai

          class ClaudeAI : AIProvider {
              override suspend fun ask(prompt: String): Result<String> =
                  Result.failure(Exception("Claude provider not configured yet."))
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/ai/GeminiAI.kt <<'EOF'
          package com.jarvis.v4.ai

          class GeminiAI : AIProvider {
              override suspend fun ask(prompt: String): Result<String> =
                  Result.failure(Exception("Gemini provider not configured yet."))
          }
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/voice/VoiceInput.kt <<'EOF'
          package com.jarvis.v4.voice
          class VoiceInput
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/voice/VoiceOutput.kt <<'EOF'
          package com.jarvis.v4.voice
          class VoiceOutput
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/core/JarvisCore.kt <<'EOF'
          package com.jarvis.v4.core
          class JarvisCore
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/actions/ActionEngine.kt <<'EOF'
          package com.jarvis.v4.actions
          class ActionEngine
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/memory/ConversationMemory.kt <<'EOF'
          package com.jarvis.v4.memory
          class ConversationMemory
          EOF

          cat > JARVIS_V4/app/src/main/java/com/jarvis/v4/memory/ContactMemory.kt <<'EOF'
          package com.jarvis.v4.memory
